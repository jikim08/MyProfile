{{ define "main" }}

<section class="profile-hero projects-hero">
    <h1>{{ .Title }}</h1>
    <p>관심 있는 주제별로 글을 찾아보세요.</p>
</section>

<section class="projects-body tags-list">
    {{ if eq (len .Site.Taxonomies.tags) 0 }}
        <p>아직 등록된 태그가 없습니다.</p>
    {{ else }}
        <ul class="post-tags">
            {{ range .Site.Taxonomies.tags.ByCount }}
                <li class="post-tag">
                    <a href="{{ .Page.RelPermalink }}">
                        <div class="tag-name">{{ .Name }}</div>
                        <div class="tag-posts-count">{{ .Count }}</div>
                    </a>
                </li>
            {{ end }}
        </ul>
    {{ end }}
</section>

{{ end }}
